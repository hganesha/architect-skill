for(const [name,data] of [['position',vertices],['normal',normals]]){const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);const a=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,0,0);}
gl.enable(gl.DEPTH_TEST);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
function mul(a,b){const o=new Array(16).fill(0);for(let c=0;c<4;c++)for(let r=0;r<4;r++)for(let k=0;k<4;k++)o[c*4+r]+=a[k*4+r]*b[c*4+k];return o;}
function camera(){const walking=$('walk').checked;let eye,forward;if(walking){eye=walk.position;forward=[Math.cos(walk.yaw)*Math.cos(walk.pitch),Math.sin(walk.yaw)*Math.cos(walk.pitch),Math.sin(walk.pitch)];}else{eye=add(target,[distance*Math.cos(yaw)*Math.cos(pitch),distance*Math.sin(yaw)*Math.cos(pitch),distance*Math.sin(pitch)]);forward=norm(sub(target,eye));}const right=norm(cross(forward,[0,0,1])),up=cross(right,forward);return {eye,forward,right,up};}
function view(cam){const {eye,forward:f,right:r,up:u}=cam;const v=[r[0],u[0],-f[0],0,r[1],u[1],-f[1],0,r[2],u[2],-f[2],0,-dot(r,eye),-dot(u,eye),dot(f,eye),1];const aspect=canvas.clientWidth/canvas.clientHeight,t=1/Math.tan(.8/2),near=.05,far=2000;return mul([t/aspect,0,0,0,0,t,0,0,0,0,(far+near)/(near-far),-1,0,0,2*far*near/(near-far),0],v);}
function lift(b){return (levelIndex.get(b.level)||0)*Number($('explode').value)*4;}
function visible(b){return ($('level').value==='all'||b.level===$('level').value)&&($('roof').checked||!(b.kind==='roof'||b.kind==='seam'||b.name.startsWith('SKY-')));}
function resize(){const r=canvas.parentElement.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*dpr),h=Math.round(r.height*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);}
canvas.addEventListener('pointerdown',e=>{canvas.focus();canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,button:e.button,moved:0};});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;drag.moved+=Math.abs(dx)+Math.abs(dy);if($('walk').checked){walk.yaw-=dx*.006;walk.pitch=Math.max(-1.4,Math.min(1.4,walk.pitch-dy*.006));}else if(drag.button===2){const c=camera();target=add(target,add(scale(c.right,-dx*distance*.0015),scale(c.up,dy*distance*.0015)));}else{yaw-=dx*.008;pitch=Math.max(.03,Math.min(1.5,pitch+dy*.008));}});
canvas.addEventListener('pointerup',e=>{if(drag&&drag.moved<5&&drag.button===0)pick(e);drag=null;});canvas.addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(2,Math.min(800,distance*Math.exp(e.deltaY*.001)));},{passive:false});
function pick(e){const cam=camera(),r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*2-1,y=1-(e.clientY-r.top)/r.height*2;const ray=norm(add(cam.forward,add(scale(cam.right,x*r.width/r.height*Math.tan(.4)),scale(cam.up,y*Math.tan(.4)))));let hit=null,best=Infinity;for(const b of boxes){if(!visible(b))continue;let lo=0,hi=Infinity;for(let k=0;k<3;k++){const center=b.center[k]+(k===2?lift(b):0),min=center-b.size[k]/2,max=center+b.size[k]/2;if(Math.abs(ray[k])<1e-9){if(cam.eye[k]<min||cam.eye[k]>max){hi=-1;break;}}else{const a=(min-cam.eye[k])/ray[k],c=(max-cam.eye[k])/ray[k];lo=Math.max(lo,Math.min(a,c));hi=Math.min(hi,Math.max(a,c));}}if(hi>=lo&&lo<best&&b.space){best=lo;hit=b.space;}}if(hit)select(hit);}
addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;keys[e.key.toLowerCase()]=true;if($('walk').checked&&'wasdqe'.includes(e.key.toLowerCase()))e.preventDefault();});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('blur',()=>{keys={};drag=null;});
function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;resize();if($('walk').checked){const f=[Math.cos(walk.yaw),Math.sin(walk.yaw),0],r=[f[1],-f[0],0];let velocity=[0,0,0];if(keys.w)velocity=add(velocity,f);if(keys.s)velocity=sub(velocity,f);if(keys.d)velocity=add(velocity,r);if(keys.a)velocity=sub(velocity,r);if(keys.q)velocity[2]-=1;if(keys.e)velocity[2]+=1;walk.position=add(walk.position,scale(velocity,dt*3));}gl.clearColor(.08,.10,.13,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);const cam=camera();gl.uniformMatrix4fv(matrix,false,new Float32Array(view(cam)));const ordered=spans.filter(s=>visible(s.b)).sort((a,b)=>(a.b.color[3]<1)-(b.b.color[3]<1)||(a.b.color[3]<1?Math.hypot(...sub(b.b.center,cam.eye))-Math.hypot(...sub(a.b.center,cam.eye)):0));for(const {b,start} of ordered){gl.depthMask(b.color[3]>=1);gl.uniform1f(liftLocation,lift(b));gl.uniform4fv(color,new Float32Array(selected===b.space?[1,.5,.2,b.color[3]]:b.color));gl.drawArrays(gl.TRIANGLES,start,36);}gl.depthMask(true);$('status').textContent=`${ordered.length} parts · ${model.levels.length} level${model.levels.length===1?'':'s'}`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
}
